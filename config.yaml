portfolio:
  starting_cash: 100000
  target_annual_return: 0.40
  max_position_pct: 0.08        # no single position > 8% of equity
  max_open_positions: 12
  cash_reserve_pct: 0.10        # always keep 10% in cash

risk:
  stop_loss_pct: 0.07           # equity stop: -7%
  take_profit_pct: 0.15         # equity target: +15%
  option_stop_loss_pct: 0.40    # options decay fast; wider stop
  option_take_profit_pct: 0.75
  max_daily_drawdown_pct: 0.04  # halt new entries if portfolio drops 4% in a day

strategy:
  swing_lookback_days: 60
  rsi_oversold: 30
  rsi_overbought: 70
  min_avg_volume: 500000
  sentiment_weight: 0.4         # 0..1 blend between TA and sentiment
  min_score_to_trade: 0.55      # composite score threshold
  bear_score_to_trade: -0.55    # mirror threshold for puts/shorts

options:
  enabled: true
  prefer_dte_min: 21
  prefer_dte_max: 45
  delta_target_long: 0.55       # moderately ITM for directional bets
  delta_target_protect: 0.30    # for hedges
  max_premium_pct: 0.03         # single option spend <= 3% of equity

sentiment:
  reddit_subs: [wallstreetbets, stocks, options, investing, StockMarket]
  reddit_post_limit: 200
  reddit_comment_limit: 50
  stocktwits_message_limit: 30
  cache_minutes: 15

data:
  vendor: yfinance        # yfinance | polygon | alphavantage | iex (paid stubs)

factors:
  weights:                # set sector_neutral: false to disable cross-sector centering
    value: 0.20
    momentum: 0.30
    quality: 0.20
    lowvol: 0.10
    size: 0.05
    meanrev: 0.15
  sector_neutral: true

backtest:
  starting_cash: 100000
  rebalance_days: 5
  max_position_weight: 0.10

risk_advanced:
  var_horizon_days: 1
  var_lookback_days: 504
  portfolio_vega_threshold: 5000
  portfolio_gamma_threshold: 500
  max_sector_pct: 0.30
  max_gross_exposure: 1.50
  max_net_exposure: 1.00
  target_beta_range: [-0.20, 1.20]
  correlation_warn_threshold: 0.85

guardrails:
  loss_cooldown_hours: 24
  max_concentration: 0.30
  max_leverage: 1.00
  override_requires_steps: 2

leveraged_etfs:
  enabled: true
  max_leverage_factor: 3              # cap |leverage| we'll suggest (1=no leverage, 3=3x)
  prefer_inverse_over_short: true     # bias bear views toward inverse ETFs vs put options
  leveraged_long_threshold: 0.85      # require very high conviction to suggest +2x/+3x longs
  max_gross_leverage: 1.50            # portfolio-wide |weight * leverage| sum cap

compliance:
  enforce_pdt_check: true
  track_wash_sales: true

notifications:                       # roadmap §13.3 — alert dispatch + audit
  backend: [stdout, file]            # active notifiers; pushover/slack/email land later
  max_per_day: 5                     # hard cap across all tickers
  max_per_ticker_per_week: 2         # prevents the same name from spamming
  resurface_score_delta: 0.10        # snoozed pick re-fires only if |score - snooze_score| ≥ this
  market_hours_only: true            # skip dispatch outside NYSE 09:30-16:00 ET on weekdays
  cadence_minutes: 15                # watch loop sleep between passes

rebalance:                           # book-level rebalancer; roadmap §13.8
  enabled: false                     # default off; explicit opt-in
  algo: equal_risk_contribution      # equal_risk_contribution | vol_target_book | mean_variance_with_views
  cadence_days: 5                    # how often the engine fires a proposal
  target_vol: 0.15                   # used by vol_target_book only
  max_turnover_per_rebalance: 0.20   # cap on total |Δweight| per proposal

conviction:                          # second-layer alert gate; roadmap §13.1
  notify_threshold: 0.70             # |score| floor for alerting; mirrors strategy.min_score_to_trade (0.55)
  cooldown_hours: 24                 # no re-alert for the same ticker within this window
  setup_validation_max_age_days: 180 # walk-forward validation must be at least this fresh
  min_setup_trades: 20               # fail closed below this sample size
  regime:
    vix_max_long: 28
    vix_max_short: 45
    yield_curve_inverted_blocks:     # setup names rejected when 10y-2y < 0
      - breakout_with_momentum
    vix_cap_exempt_setups:           # setup names that may pass even when VIX > cap
      - mean_reversion_oversold
  data_quality:
    max_price_age_seconds: 900       # 15 min during market hours
    max_fundamentals_age_seconds: 604800   # 7 days

watchlist:
  - AAPL
  - MSFT
  - NVDA
  - AMD
  - TSLA
  - META
  - GOOGL
  - AMZN
  - SPY
  - QQQ
  - COIN
  - PLTR
